name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:

  typescript-lint:
    name: TypeScript / Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          run_install: true
      - run: pnpm lint

  typescript-typecheck:
    name: TypeScript / Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          run_install: true
      - run: pnpm check

  typescript-test:
    name: TypeScript / Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          run_install: true
      - run: pnpm test

  typescript-build:
    name: TypeScript / Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          run_install: true
      - run: pnpm build
      - name: Verify entry point
        run: test -f dist/index.js

  widget-bundle:
    name: TypeScript / Widget bundle up-to-date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          run_install: true
      - run: pnpm build:widget
      - name: Verify committed widget bundle is up to date
        run: |
          if ! git diff --exit-code -- python/src/vizarr/_widget.js; then
            echo "::error::python/src/vizarr/_widget.js is stale. Run 'pnpm build:widget' and commit the result."
            exit 1
          fi

  python-lint:
    name: Python / Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
      - run: |
          uv run --directory python ruff format --check
          uv run --directory python ruff check

  python-test:
    name: Python / Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
      - run: uv run --directory python pytest

  python-typecheck:
    name: Python / Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
      - run: uv run --directory python ty check
