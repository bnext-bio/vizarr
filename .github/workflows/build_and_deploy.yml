name: Build and Deploy
on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          run_install: true
      - run: |
          pnpm build
          # Publish the anywidget bundle so static hosts (e.g. MyST's
          # `{anywidget}` directive) can load it from <pages-url>/widget.mjs.
          pnpm build:widget
          cp python/src/vizarr/_widget.js dist/widget.mjs
          touch dist/.nojekyll

      - name: Deploy 🚀
        uses: JamesIves/github-pages-deploy-action@v4.8.0
        with:
          branch: gh-pages
          folder: dist
          clean: true
          clean-exclude: |
            v0.1
            v0.2
            v0.3
